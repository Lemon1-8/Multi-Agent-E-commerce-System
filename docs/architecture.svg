<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">多智能体跨境电商系统架构</title>
        <desc id="architecture-desc">架构图展示 React/Vite 客户端通过 REST 和 Socket.IO 进入 NestJS 应用，经意图解析、任务编排和三类领域智能体运行时，访问外部模型与数据服务。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: rgba(45,49,66,0.12);
      --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08);
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--sans); color: var(--ink); }
      #architecture-root .subtitle { color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 760px; margin-bottom: 24px; }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }</style>
          <pattern id="architecture-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#architecture-dots)" opacity="0.45"/>

        <!-- Three flat zones, drawn before arrows and nodes. -->
        <rect x="40" y="112" width="224" height="512" rx="8" fill="#4f5d75" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.03" stroke-opacity="0.18"/>
        <rect x="288" y="112" width="660" height="512" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="968" y="112" width="272" height="512" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>

        <rect x="112" y="116" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="152" y="128" fill="#5a6580" font-size="12" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="middle">客户端</text>
        <rect x="520" y="116" width="196" height="16" rx="2" fill="#f5f5f5"/>
        <text x="618" y="128" fill="#5a6580" font-size="12" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-weight="500" text-anchor="middle">NestJS 应用</text>
        <rect x="1032" y="116" width="144" height="16" rx="2" fill="#f5f5f5"/>
