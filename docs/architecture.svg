        <line x1="952" y1="320" x2="1004" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <path d="M 952,336 H 980 Q 988,336 988,344 V 448 H 1004" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
