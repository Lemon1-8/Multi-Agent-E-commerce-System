        <text x="872" y="306" fill="#4f5d75" font-size="12" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">ReAct 循环 · 最多 10 轮</text>
        <text x="872" y="326" fill="#4f5d75" font-size="12" font-family="'Noto Sans SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">选品 · 订单 · 客服</text>
