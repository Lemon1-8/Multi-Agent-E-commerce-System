<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: rgba(45,49,66,0.12);
      --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08);
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      padding: 40px 32px;
    }
    .frame { max-width: 1280px; width: 100%; margin: 0 auto; }
    .eyebrow {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    h1 {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .subtitle { color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 760px; margin-bottom: 24px; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>

    <p class="eyebrow">架构 · 多智能体跨境电商系统</p>
    <h1>从用户请求到多智能体协作</h1>
